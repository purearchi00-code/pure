<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.A.R.I — 건축물대장 조회</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .preset-btn {
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    .result {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }

    .result.hidden {
      display: none;
    }

    .result-header {
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .result-status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .result-status.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }

    .result-status.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }

    .result-status.loading {
      background: #e3f2fd;
      color: #1565c0;
      border: 1px solid #2196f3;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .result-item {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .result-item-label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .result-item-value {
      font-size: 16px;
      color: #333;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .json-viewer {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #333;
      max-height: 200px;
      overflow: auto;
      margin-top: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏢 D.A.R.I</h1>
      <p>건축물대장 조회</p>
    </div>

    <form id="searchForm">
      <div class="form-group">
        <label for="address">주소 입력 (동/지번)</label>
        <input
          type="text"
          id="address"
          placeholder="예: 신사동 529"
          value="신사동 529"
        >

        <div class="presets">
          <button type="button" class="preset-btn" onclick="setAddress('신사동 529')">신사동 529</button>
          <button type="button" class="preset-btn" onclick="setAddress('압구정동 480')">압구정동 480</button>
          <button type="button" class="preset-btn" onclick="setAddress('청담동 88')">청담동 88</button>
          <button type="button" class="preset-btn" onclick="setAddress('역삼동 825')">역삼동 825</button>
        </div>
      </div>

      <button type="submit">조회하기</button>
    </form>

    <div id="result" class="result hidden">
      <div class="result-header">조회 결과</div>
      <div id="resultStatus" class="result-status"></div>

      <div id="resultData" class="result-grid"></div>

      <details>
        <summary style="cursor: pointer; color: #667eea; font-size: 12px; margin-top: 12px;">원본 JSON 보기</summary>
        <div id="jsonViewer" class="json-viewer"></div>
      </details>
    </div>
  </div>

  <script>
    const PRESETS = {
      '신사동 529': { dong: '신사동', jibun: '529' },
      '압구정동 480': { dong: '압구정동', jibun: '480' },
      '청담동 88': { dong: '청담동', jibun: '88' },
      '역삼동 825': { dong: '역삼동', jibun: '825' },
    };

    function setAddress(addr) {
      document.getElementById('address').value = addr;
      document.getElementById('searchForm').dispatchEvent(new Event('submit'));
    }

    function showResult(msg, type = 'loading') {
      const result = document.getElementById('result');
      const status = document.getElementById('resultStatus');
      result.classList.remove('hidden');
      status.textContent = msg;
      status.className = `result-status ${type}`;
    }

    function formatNumber(n) {
      if (!n || n === '0') return '—';
      return parseFloat(n).toLocaleString('ko-KR');
    }

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const addr = document.getElementById('address').value.trim();
      if (!addr) return;

      showResult('조회 중...', 'loading');

      try {
        const res = await fetch('/api/building', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: addr })
        });

        const data = await res.json();

        if (data.error) {
          showResult(`❌ ${data.error}`, 'error');
          return;
        }

        if (!data.item) {
          showResult('⚠️ 조회 결과가 없습니다', 'error');
          document.getElementById('jsonViewer').textContent = JSON.stringify(data.raw, null, 2);
          return;
        }

        const item = data.item;
        showResult('✅ 조회 성공', 'success');

        const html = `
          <div class="result-item">
            <div class="result-item-label">주소</div>
            <div class="result-item-value">${item.platPlc || '—'}</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">용도</div>
            <div class="result-item-value">${item.mainPurpsCdNm || '—'}</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">건축면적</div>
            <div class="result-item-value">${formatNumber(item.archArea)} ㎡</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">연면적</div>
            <div class="result-item-value">${formatNumber(item.totArea)} ㎡</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">건폐율</div>
            <div class="result-item-value">${formatNumber(item.bcRat)} %</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">용적률</div>
            <div class="result-item-value">${formatNumber(item.vlRat)} %</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">구조</div>
            <div class="result-item-value">${item.strctCdNm || '—'}</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">층수</div>
            <div class="result-item-value">지상 ${item.grndFlrCnt || 0} / 지하 ${item.ugrndFlrCnt || 0}</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">건축허가일</div>
            <div class="result-item-value">${item.pmsDay ? item.pmsDay.slice(0,4) + '-' + item.pmsDay.slice(4,6) + '-' + item.pmsDay.slice(6,8) : '—'}</div>
          </div>
          <div class="result-item">
            <div class="result-item-label">사용승인일</div>
            <div class="result-item-value">${item.useAprDay ? item.useAprDay.slice(0,4) + '-' + item.useAprDay.slice(4,6) + '-' + item.useAprDay.slice(6,8) : '—'}</div>
          </div>
        `;

        document.getElementById('resultData').innerHTML = html;
        document.getElementById('jsonViewer').textContent = JSON.stringify(data.raw, null, 2);

      } catch (err) {
        showResult(`❌ 오류: ${err.message}`, 'error');
      }
    });

    // 페이지 로드 시 기본 조회
    window.addEventListener('load', () => {
      document.getElementById('searchForm').dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
