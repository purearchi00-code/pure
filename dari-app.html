<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D.A.R.I — Routing Intelligence for the Vulnerable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy-deep: #060B22;
      --navy-dark: #0F1A3D;
      --navy: #1B2B5C;
      --gold: #C9A961;
      --gold-light: #D9BC75;
      --sand: #F5F2EC;
      --ice: #D9E2F0;
      --signal-green: #2E7D5B;
      --signal-amber: #B8821F;
      --signal-red: #8B2E2E;
      --amber-soft: #FFF4D6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--sand);
      color: var(--navy);
      min-height: 100vh;
    }

    /* TOP BAR */
    .topbar {
      background: var(--navy-deep);
      color: white;
      padding: 22px 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--gold);
    }
    .topbar-left { display: flex; align-items: center; gap: 18px; }
    .topbar-dot { width: 10px; height: 10px; background: var(--gold); border-radius: 50%; }
    .topbar-logo { font-size: 22px; font-weight: 800; letter-spacing: 3px; color: white; }
    .topbar-tagline { font-size: 12px; letter-spacing: 2.5px; color: rgba(255,255,255,0.65); font-weight: 500; }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 60px 80px;
    }

    .panel {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(6, 11, 34, 0.06);
      padding: 50px 60px;
      margin-bottom: 28px;
    }

    .step-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--navy-deep);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .panel-subtitle {
      font-size: 14px;
      color: rgba(27, 43, 92, 0.55);
      margin-bottom: 28px;
    }

    /* STEP 1 */
    textarea.question-input {
      width: 100%;
      min-height: 120px;
      padding: 20px 22px;
      background: #F8F7F2;
      border: 1.5px solid #E8E3D6;
      border-radius: 6px;
      color: var(--navy-deep);
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: all 0.2s;
      line-height: 1.6;
    }
    textarea.question-input:focus { border-color: var(--gold); background: white; }

    .examples { margin-top: 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .examples-label { font-size: 13px; color: rgba(27, 43, 92, 0.55); margin-right: 6px; font-weight: 500; }
    .example-chip {
      padding: 8px 18px;
      background: #F5F2EC;
      border: 1.5px solid #E8E3D6;
      border-radius: 100px;
      font-size: 13px;
      color: var(--navy);
      cursor: pointer;
      font-family: inherit;
    }
    .example-chip:hover {
      background: var(--gold);
      color: var(--navy-deep);
      border-color: var(--gold);
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 20px;
      margin-top: 32px;
    }
    .field-group label {
      display: block; font-size: 13px; color: var(--navy);
      font-weight: 600; margin-bottom: 10px;
    }
    .field-group input {
      width: 100%; padding: 14px 18px;
      border: 1.5px solid #E8E3D6; border-radius: 6px;
      font-size: 15px; color: var(--navy-deep);
      background: white; outline: none; font-family: inherit;
    }
    .field-group input:focus { border-color: var(--gold); }

    .btn-submit {
      width: 100%;
      padding: 22px;
      margin-top: 32px;
      background: var(--navy-dark);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: var(--navy-deep); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; }

    /* STATUS BANNER */
    .api-status {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .api-status.real { background: #E6F1EC; color: var(--signal-green); }
    .api-status.demo { background: #FFF1D6; color: var(--signal-amber); }
    .api-status.error { background: #FFE6E6; color: var(--signal-red); }

    /* STEP 2 */
    .hidden { display: none !important; }

    .loading-overlay {
      text-align: center;
      padding: 60px 20px;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid #E8E3D6;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .verdict-card {
      border-radius: 6px;
      padding: 22px 26px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }
    .verdict-card.amber { background: var(--amber-soft); border-left: 5px solid var(--gold); }
    .verdict-card.green { background: #E6F1EC; border-left: 5px solid var(--signal-green); }
    .verdict-card.red { background: #FFE6E6; border-left: 5px solid var(--signal-red); }

    .verdict-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 22px;
      flex-shrink: 0;
    }
    .verdict-icon.amber { background: var(--gold); }
    .verdict-icon.green { background: var(--signal-green); }
    .verdict-icon.red { background: var(--signal-red); }

    .verdict-content h3 { font-size: 17px; font-weight: 800; color: var(--navy-deep); margin-bottom: 4px; }
    .verdict-content p { font-size: 14px; color: var(--navy); opacity: 0.85; }

    .plain-explain {
      padding: 22px 26px;
      background: #FBFAF6;
      border-radius: 6px;
      border: 1.5px solid #E8E3D6;
      line-height: 1.8;
      font-size: 14px;
      color: var(--navy);
      margin-bottom: 32px;
    }
    .plain-explain strong { color: var(--navy-deep); }
    .plain-explain .highlight { color: var(--gold); font-weight: 800; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 36px;
    }
    .stat-card {
      background: #FBFAF6;
      border: 1.5px solid #E8E3D6;
      border-radius: 8px;
      padding: 26px 16px;
      text-align: center;
    }
    .stat-label { font-size: 12px; color: rgba(27, 43, 92, 0.6); font-weight: 600; margin-bottom: 10px; }
    .stat-value { font-size: 32px; font-weight: 800; color: var(--gold); letter-spacing: -0.5px; }
    .stat-sub { font-size: 11px; color: rgba(27, 43, 92, 0.5); margin-top: 6px; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 3px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--navy-deep);
    }
    .section-title .badge { color: var(--gold); margin-left: 8px; font-size: 10px; letter-spacing: 1.5px; }

    .law-list { list-style: none; }
    .law-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid #EFEBE0; gap: 16px;
    }
    .law-item:last-child { border-bottom: none; }
    .law-tag {
      display: inline-block; padding: 4px 10px;
      background: var(--navy-deep); color: white; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      min-width: 56px; text-align: center; flex-shrink: 0;
    }
    .law-text { flex: 1; font-size: 13px; color: var(--navy); }
    .law-link { font-size: 12px; color: var(--gold); text-decoration: none; font-weight: 600; }
    .law-link:hover { text-decoration: underline; }

    .data-card {
      padding: 18px 22px;
      background: var(--navy-deep);
      color: white;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .data-card .label { font-size: 11px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; margin-bottom: 12px; }
    .data-card .row {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .data-card .row:last-child { border-bottom: none; }
    .data-card .row .k { color: rgba(255,255,255,0.6); }
    .data-card .row .v { color: white; font-weight: 600; }

    .signed-panel {
      background: var(--navy-deep);
      color: white;
      border-radius: 8px;
      padding: 40px 50px;
      border: 2px solid var(--gold);
      margin-top: 30px;
    }
    .signed-badge {
      display: inline-block; padding: 6px 16px;
      background: var(--gold); color: var(--navy-deep);
      font-size: 11px; font-weight: 800; letter-spacing: 2px;
      border-radius: 4px; margin-bottom: 14px;
    }
    .signed-panel h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    .signed-panel p.sub { font-size: 13.5px; color: rgba(255,255,255,0.7); margin-bottom: 26px; }

    .signed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 30px;
    }
    .signed-item {
      display: flex; gap: 16px;
      padding: 18px 22px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(201, 169, 97, 0.2);
    }
    .signed-num {
      width: 28px; height: 28px;
      background: var(--gold); color: var(--navy-deep);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; flex-shrink: 0;
    }
    .signed-item .label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
    .signed-item .value { font-size: 13px; font-weight: 600; color: white; word-break: break-all; }
    .signed-item .value.mono { font-family: "SF Mono", Monaco, monospace; font-size: 12px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .action-btn {
      padding: 16px; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      border: none; font-family: inherit;
    }
    .action-primary { background: var(--gold); color: var(--navy-deep); }
    .action-primary:hover { background: var(--gold-light); }
    .action-secondary { background: white; color: var(--navy-deep); border: 1.5px solid white; }
    .action-secondary:hover { background: var(--ice); }

    @media (max-width: 900px) {
      main { padding: 24px; }
      .panel { padding: 30px 22px; }
      .panel-title { font-size: 24px; }
      .topbar { padding: 16px 24px; flex-direction: column; gap: 8px; align-items: flex-start; }
      .form-row, .stats-grid, .two-col, .signed-grid, .actions { grid-template-columns: 1fr; }
      .signed-panel { padding: 28px 22px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-dot"></div>
      <div class="topbar-logo">D.A.R.I</div>
      <div class="topbar-tagline">ROUTING INTELLIGENCE FOR THE VULNERABLE</div>
    </div>
  </header>

  <main>

    <!-- STEP 1 -->
    <section id="step1" class="panel">
      <div class="step-label">STEP 1 · 시민 질문</div>
      <h1 class="panel-title">건축법, 시민의 일상어로 물어보세요</h1>
      <p class="panel-subtitle">전문 용어 없이, 일상 표현 그대로 입력하시면 됩니다.</p>

      <textarea id="question" class="question-input" placeholder="예: 우리집 옥상에 한 층 더 올릴 수 있어요?">우리집 옥상에 한 층 더 올릴 수 있어요?</textarea>

      <div class="examples">
        <span class="examples-label">예시 →</span>
        <button type="button" class="example-chip" onclick="setQ('우리집 옥상에 한 층 더 올릴 수 있어요?')">옥상에 한 층 더 올리기</button>
        <button type="button" class="example-chip" onclick="setQ('베란다에 방 하나 더 만들어도 돼요?')">베란다에 방 만들기</button>
        <button type="button" class="example-chip" onclick="setQ('1층 상가를 카페로 바꿔도 되나요?')">1층을 카페로 바꾸기</button>
        <button type="button" class="example-chip" onclick="setQ('이 부지에 새로 건물을 지으려면 어떻게 해요?')">신축 (새로 짓기)</button>
        <button type="button" class="example-chip" onclick="setQ('주차장이 부족한데 늘릴 수 있나요?')">주차장 늘리기</button>
      </div>

      <div class="form-row">
        <div class="field-group">
          <label>건물 주소 (강남구 신사동/압구정동/청담동/역삼동/삼성동 지원)</label>
          <input id="address" type="text" value="서울 강남구 신사동 529">
        </div>
        <div class="field-group">
          <label>대지면적 (㎡)</label>
          <input id="landArea" type="number" value="250">
        </div>
        <div class="field-group">
          <label>검토 용적률 (%)</label>
          <input id="targetFar" type="number" value="300">
        </div>
      </div>

      <button id="submitBtn" class="btn-submit" onclick="runReview()">건축법 검토 시작</button>
    </section>

    <!-- LOADING -->
    <section id="loading" class="panel hidden">
      <div class="loading-overlay">
        <div class="spinner"></div>
        <p style="color: var(--navy); font-size: 14px;">국토교통부 건축HUB API 호출 중…</p>
        <p id="loadingDetail" style="color: rgba(27,43,92,0.5); font-size: 12px; margin-top: 8px;"></p>
      </div>
    </section>

    <!-- STEP 2 -->
    <section id="step2" class="panel hidden">
      <div class="step-label">STEP 2 · 시민용 요약 <span id="apiStatusInline"></span></div>
      <h1 class="panel-title" id="resultTitle"></h1>
      <div id="resultBody"></div>
    </section>

  </main>

  <script>
    // ============================================================
    // 설정
    // ============================================================
    const API_KEY = 'a96b45d2cf830f8009ca2be0c655b6743fba9e45b965be952f16f20879185dd4';
    const API_BASE = 'https://apis.data.go.kr/1613000/BldRgstHubService/getBrTitleInfo';
    // CORS 우회용 공개 프록시 (file:// 더블클릭 환경에서 직접 호출 시 사용)
    const CORS_PROXY = 'https://corsproxy.io/?';

    const DONG_CODES = {
      '신사동': { sgg: '11680', bjd: '10700' },
      '압구정동': { sgg: '11680', bjd: '11000' },
      '청담동': { sgg: '11680', bjd: '10800' },
      '역삼동': { sgg: '11680', bjd: '10100' },
      '삼성동': { sgg: '11680', bjd: '10500' },
    };

    // ============================================================
    // 의도 분류 (키워드 기반)
    // ============================================================
    const INTENTS = [
      {
        id: 'newBuild',
        keywords: ['신축', '새로 짓', '새 건물', '새집', '새로 건물', '새로 지'],
        title: '신축 (새로운 건물)',
        verdict: 'amber',
        verdictTitle: '신축은 종합 검토가 필요합니다',
        verdictSub: '용도지역·건폐율·용적률·일조권·주차 기준을 모두 충족해야 합니다.',
        explain: (data, addr) => `
          말씀하신 <strong>신축(새 건물 짓기)</strong>은 ${addr}에서
          ① 용도지역 적합성(${data.zoning || '미확인'})

        `,
        laws: [

          { tag: '용도', text: '건축법 시행령 별표1 (용도별 건축물)' },
          { tag: '높이', text: '건축법 제60조 (건축물 높이 제한)' },
          { tag: '일조권', text: '건축법 제61조 (일조 등 확보)' },
          { tag: '주차장', text: '주차장법 시행령 별표1' },

      {

        verdictSub: '현재 ${data.totArea}㎡에서 추가 가능 면적·구조 안전 진단이 필수입니다.',
        explain: (data, addr) => `
          말씀하신 <strong>증축(한 층 더 올리기/면적 확장)</strong>은

          현재 연면적 <strong>${data.totArea || '?'}㎡</strong> · 지상 <strong>${data.grndFlrCnt || '?'}층</strong> · ${data.strctCdNm || '구조 미확인'}.
          용적률 한도까지 남은 여유분과 <strong>구조 안전 진단</strong>(기존 골조가 추가 하중을 견딜 수 있는지)이
          확인되어야 합니다. <span class="highlight">옥상에 한 층 더 = 수직 증축</span>은 특히 구조검토가 핵심입니다.
        `,
        laws: [
          { tag: '증축', text: '건축법 제2조 1항 8호 (증축 정의)' },
          { tag: '허가', text: '건축법 제11조 (건축허가)' },
          { tag: '구조', text: '건축법 제48조 (구조내력 및 구조안전 확인)' },
          { tag: '용적률', text: '국토계획법 제78조 (용적률)' },
          { tag: '높이', text: '건축법 제60조 (높이 제한)' },
          { tag: '일조권', text: '건축법 시행령 제86조' },
        ],
      },
      {
        id: 'balcony',
        keywords: ['발코니', '베란다'],
        title: '발코니 확장',

        verdictTitle: '발코니 확장은 신고 절차가 필요합니다',
        verdictSub: '2005년 12월 이후 합법화되었지만, 구조 안전 진단과 신고가 필수입니다.',

    function lawUrl(text) {
      // 1. 괄호 안 설명 제거
      let clean = text.replace(/\([^)]*\)/g, '').trim();

      // 2. 법령명만 추출 (제X조, 별표, 별지 앞까지)
      let baseLaw = clean;
      const cuts = [
        clean.search(/\s+제\d+/),
        clean.search(/\s+별표/),
        clean.search(/\s+별지/),
        clean.search(/\s+부칙/),
      ].filter(i => i > 0);

      if (cuts.length > 0) {
        baseLaw = clean.substring(0, Math.min(...cuts)).trim();
      }

      // 3. 직접 URL이 매핑되어 있으면 사용
      if (LAW_DIRECT[baseLaw]) {
        return LAW_DIRECT[baseLaw];
      }

      // 4. fallback: 국가법령정보센터 검색
      return `https://www.law.go.kr/LSW/lsSc.do?section=&menuId=1&subMenuId=15&tabMenuId=81&eventGubun=060101&query=${encodeURIComponent(text)}`;
    }

    function resolveAddress(addr) {
      for (const [dong, code] of Object.entries(DONG_CODES)) {
        if (addr.includes(dong)) {
          const m = addr.match(/(\d+)(?:-(\d+))?/);
          if (!m) return null;
          return {
            dong,
            sgg: code.sgg,
            bjd: code.bjd,
            bun: m[1].padStart(4, '0'),
            ji: (m[2] ?? '0').padStart(4, '0'),
          };
        }
      }
      return null;
    }

    // ============================================================
    async function fetchBuildingData(addr) {
      const parsed = resolveAddress(addr);
      if (!parsed) {
        return { ok: false, source: 'unsupported', error: '지원하지 않는 동입니다 (강남구 5개 동만 지원)' };
      }

      const params = new URLSearchParams({
        serviceKey: API_KEY,
        sigunguCd: parsed.sgg,
        bjdongCd: parsed.bjd,
        platGbCd: '0',
        bun: parsed.bun,
        ji: parsed.ji,
        numOfRows: '5',
        pageNo: '1',
        _type: 'json',
      });

      const realUrl = `${API_BASE}?${params}`;
      const proxiedUrl = `${CORS_PROXY}${encodeURIComponent(realUrl)}`;

      // 시도 1: CORS 프록시 경유
      setLoadingDetail('CORS 프록시 경유 호출…');
      try {
        const res = await fetch(proxiedUrl, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const item = extractItem(data);
          if (item) return { ok: true, source: 'real (corsproxy)', item, raw: data };
        }
      } catch (e) {
        console.warn('corsproxy 실패:', e);
      }

      // 시도 2: 직접 호출 (CORS 허용되는 경우)
      setLoadingDetail('직접 API 호출 시도…');
      try {
        const res = await fetch(realUrl);
        if (res.ok) {
          const data = await res.json();
          const item = extractItem(data);
          if (item) return { ok: true, source: 'real (direct)', item, raw: data };
        }
      } catch (e) {
        console.warn('직접 호출 실패:', e);
      }

      // 시도 3: mock 데이터 fallback
      setLoadingDetail('CORS 차단 — mock 데이터로 표시…');
      const mock = MOCK_DATA[parsed.dong];
      if (mock) return { ok: true, source: 'mock', item: mock };

      return { ok: false, source: 'error', error: '모든 호출 실패' };
    }

          : `<span class="api-status demo">⚠ CORS 차단 — Mock 데이터 사용</span>`;
      document.getElementById('apiStatusInline').innerHTML = apiBadge;

      const verdictTitle = intent.verdictTitle.replace('${data.totArea}', data.totArea || '?');
      const explainHtml = intent.explain(data, address);
      const lawsHtml = intent.laws.map(l => `
        <li class="law-item">
          <span class="law-tag">${l.tag}</span>
          <span class="law-text">${l.text}</span>
          <a class="law-link" href="${lawUrl(l.text)}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>
        </li>
      `).join('');

      const now = new Date();
      const ts = now.toISOString().slice(0, 19).replace('T', ' ') + ' KST';
      const docNum = `DARI-${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}-${Math.floor(Math.random()*9000+1000)}`;

      // 통계 카드 값 (실 데이터 우선, 없으면 입력값/계산값)
      const bcr = data.bcRat || 0;
      const vlr = data.vlRat || targetFar;
      const parking = data.oudrAutoUtcnt || 0;
      const floors = data.grndFlrCnt || 0;

      document.getElementById('resultBody').innerHTML = `
        <div class="verdict-card ${intent.verdict}">
          <div class="verdict-icon ${intent.verdict}">!</div>
          <div class="verdict-content">
            <h3>${verdictTitle}</h3>
            <p>${intent.verdictSub}</p>
          </div>
        </div>

        <div class="plain-explain">
          <strong>시민님의 질문:</strong> "${question}"<br><br>
          <strong>쉽게 설명드리면:</strong> ${explainHtml}
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">현재 건폐율</div>
            <div class="stat-value">${bcr || '—'}${bcr ? '%' : ''}</div>
            <div class="stat-sub">${bcr ? '대장 등재값' : '미등록'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">현재 용적률</div>
            <div class="stat-value">${vlr || '—'}${vlr ? '%' : ''}</div>
            <div class="stat-sub">${data.vlRat ? '대장 등재값' : '입력값'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">주차대수</div>
            <div class="stat-value">${parking || '—'}${parking ? '대' : ''}</div>
            <div class="stat-sub">옥외 자주식</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">기존 층수</div>
            <div class="stat-value">${floors || '—'}${floors ? 'F' : ''}</div>
            <div class="stat-sub">${data.ugrndFlrCnt ? '지하 ' + data.ugrndFlrCnt + 'F' : ''}</div>
          </div>
        </div>

        <div class="two-col">
          <div>
            <div class="section-title">관련 법규 원문 <span class="badge">· INTENT MATCH</span></div>
            <ul class="law-list">${lawsHtml}</ul>
          </div>

          <div>
            <div class="section-title">건축물대장 실데이터 <span class="badge">· ${apiResult.source || 'N/A'}</span></div>
            <div class="data-card">
              <div class="label">건축물대장 표제부</div>
              <div class="row"><span class="k">소재지</span><span class="v">${data.platPlc || '—'}</span></div>
              <div class="row"><span class="k">도로명</span><span class="v">${data.newPlatPlc || '—'}</span></div>
              <div class="row"><span class="k">건물명</span><span class="v">${data.bldNm || '(없음)'}</span></div>
              <div class="row"><span class="k">주용도</span><span class="v">${data.mainPurpsCdNm || '—'}</span></div>
              <div class="row"><span class="k">구조</span><span class="v">${data.strctCdNm || '—'}</span></div>
              <div class="row"><span class="k">건축면적</span><span class="v">${fmt(data.archArea)} ㎡</span></div>
              <div class="row"><span class="k">연면적</span><span class="v">${fmt(data.totArea)} ㎡</span></div>
              <div class="row"><span class="k">층수</span><span class="v">지상 ${data.grndFlrCnt || 0} / 지하 ${data.ugrndFlrCnt || 0}</span></div>
              <div class="row"><span class="k">사용승인일</span><span class="v">${fmtDate(data.useAprDay)}</span></div>
            </div>
          </div>
        </div>

        <div class="signed-panel">
          <span class="signed-badge">SIGNED-AI</span>
          <h2>책임 있는 AI 검토서</h2>
          <p class="sub">본 검토는 국토교통부 건축HUB 실시간 API + 키워드 의도 분류기로 생성되었습니다. 분쟁 시 건축사 추가 검토가 필요합니다.</p>

          <div class="signed-grid">
            <div class="signed-item">
              <div class="signed-num">1</div>
              <div>
                <div class="label">데이터 출처</div>
                <div class="value">${isReal ? '국토교통부 건축HUB (실시간 API)' : '내장 Mock 데이터'}</div>
              </div>
            </div>
            <div class="signed-item">
              <div class="signed-num">2</div>
              <div>
                <div class="label">의도 분류 결과</div>
                <div class="value">${intent.id} — ${intent.title}</div>
              </div>
            </div>
            <div class="signed-item">
              <div class="signed-num">3</div>
              <div>
                <div class="label">검토 일시</div>
                <div class="value">${ts}</div>
              </div>
            </div>
            <div class="signed-item">
              <div class="signed-num">4</div>
              <div>
                <div class="label">문서 번호</div>
                <div class="value mono">${docNum}</div>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="action-btn action-primary" onclick="window.print()">📄  PDF로 저장</button>
            <button class="action-btn action-secondary" onclick="alert('건축사 매칭은 추후 베타에서 제공됩니다.')">👤  건축사 상담 매칭</button>
            <button class="action-btn action-secondary" onclick="resetForm()">↺  처음부터 다시</button>
          </div>
        </div>
      `;
    }

    function resetForm() {
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('loading').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
